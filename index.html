<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐟 Karasik Talk</title>
    
    <script type="importmap">
        {
            "imports": {
                "firebase": "https://www.gstatic.com/firebasejs/12.15.0/firebase.js",
                "firebase/": "https://www.gstatic.com/firebasejs/12.15.0/"
            }
        }
    </script>
    
    <style>
        /* ===== ПЕРЕМЕННЫЕ ===== */
        :root {
            --bg: #f0e6d3;
            --bg2: #e8dcc8;
            --card: rgba(255,255,255,0.95);
            --text: #4a3a2a;
            --text-light: #8b6b4a;
            --border: #f4a460;
            --input-bg: #ffffff;
            --input-border: #f0d5b0;
            --shadow: rgba(0,0,0,0.1);
            --primary: #f4a460;
            --primary-dark: #d4884a;
            --secondary: #1a6a8a;
            --chat-bg: #faf6f0;
            --msg-bg: #f8f0e8;
            --user-bg: #e8f5e8;
            --notification: #1a6a8a;
            --notification-text: #ffffff;
            --success: #4a8a4a;
            --danger: #dc2626;
        }
        
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --bg2: #16162a;
            --card: rgba(30,30,50,0.95);
            --text: #e8d5c0;
            --text-light: #b89a7a;
            --input-bg: #2a2a42;
            --input-border: #3a3a5a;
            --shadow: rgba(0,0,0,0.5);
            --chat-bg: #22223a;
            --msg-bg: #2a2a42;
            --user-bg: #1a3a2a;
            --notification: #f4a460;
            --notification-text: #1a1a2e;
        }
        
        [data-color="blue"] { --border: #4a8ad4; --primary: #4a8ad4; --primary-dark: #3a7ac4; --notification: #4a8ad4; }
        [data-color="green"] { --border: #4aaf4a; --primary: #4aaf4a; --primary-dark: #3a9f3a; --notification: #4aaf4a; }
        [data-color="purple"] { --border: #9b59b6; --primary: #9b59b6; --primary-dark: #8b49a6; --notification: #9b59b6; }
        [data-color="pink"] { --border: #e84393; --primary: #e84393; --primary-dark: #d83383; --notification: #e84393; }
        
        /* ===== ОСНОВНЫЕ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
            color: var(--text);
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: var(--card);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 35px -10px var(--shadow);
            border: 2px solid var(--border);
            transition: background 0.3s, border 0.3s;
        }
        h1 {
            color: var(--text);
            font-size: 2rem;
            border-left: 5px solid var(--border);
            padding-left: 16px;
            margin-bottom: 8px;
        }
        .subtitle { color: var(--text-light); padding-left: 16px; margin-bottom: 20px; }
        
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .top-bar button {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 30px;
            padding: 8px 16px;
            color: var(--text);
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .top-bar button:hover { background: var(--border); color: white; }
        .theme-btn { font-size: 1.2rem; padding: 8px 14px; }
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--text);
            cursor: pointer;
            transition: 0.2s;
            padding: 0;
        }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border: 3px solid var(--notification); box-shadow: 0 0 12px var(--notification); }
        
        .login-area {
            background: var(--bg2);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .login-area input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 2px solid var(--input-border);
            border-radius: 30px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text);
            transition: 0.2s;
        }
        .login-area input:focus { outline: none; border-color: var(--border); }
        .login-area button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
        }
        .login-area .login-btn { background: var(--primary); color: white; }
        .login-area .login-btn:hover { background: var(--primary-dark); }
        .login-area .register-btn { background: var(--secondary); color: white; }
        .login-area .register-btn:hover { opacity: 0.85; }
        
        .user-info {
            background: var(--user-bg);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .user-info .uname { font-weight: bold; color: var(--text); }
        .user-info .urole {
            background: var(--primary);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }
        .user-info .logout-btn {
            background: var(--danger);
            border: none;
            padding: 4px 16px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }
        
        .error-box { background: #fff1f0; border-radius: 16px; padding: 12px; color: #b34e3a; border: 1px solid #ffc6be; margin-top: 8px; }
        .success-box { background: #d4edda; border-radius: 16px; padding: 12px; color: #155724; border: 1px solid #c3e6cb; margin-top: 8px; }
        .loading { text-align: center; padding: 20px; color: var(--text-light); }
        
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            background: var(--bg2);
            color: var(--text);
            transition: 0.2s;
        }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .passport-card {
            background: linear-gradient(140deg, var(--bg2), var(--card));
            border-radius: 32px;
            padding: 20px;
            border: 2px solid var(--border);
            margin-top: 12px;
        }
        .passport-card .badge {
            background: var(--primary);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            color: white;
            margin-bottom: 18px;
        }
        .passport-card .name { font-size: 1.8rem; font-weight: 700; color: var(--text); }
        .passport-card .detail {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 1px dashed var(--input-border);
            padding: 12px 0;
        }
        .passport-card .label { font-weight: 600; color: var(--text-light); }
        .passport-card .role-tag {
            background: var(--primary);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }
        
        .chat-list-item {
            background: var(--bg2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 4px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-list-item:hover { background: var(--input-border); }
        .chat-list-item .cname { font-weight: bold; color: var(--text); }
        .chat-list-item .cmembers { font-size: 0.8rem; color: var(--text-light); }
        
        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            background: var(--chat-bg);
            border-radius: 20px;
            border: 2px solid var(--input-border);
            margin-bottom: 16px;
        }
        .message-item {
            background: var(--msg-bg);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 4px solid var(--border);
        }
        .message-item .msg-user { font-weight: bold; color: var(--text); }
        .message-item .msg-time { font-size: 0.65rem; color: var(--text-light); float: right; }
        .message-item .msg-text { margin-top: 4px; color: var(--text); }
        
        .chat-input-area {
            display: flex;
            gap: 12px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--input-border);
            border-radius: 40px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text);
        }
        .chat-input-area input:focus { outline: none; border-color: var(--border); }
        .chat-input-area button {
            background: var(--primary);
            border: none;
            padding: 0 28px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-input-area button:hover { background: var(--primary-dark); }
        
        .create-chat-area {
            background: var(--bg2);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .create-chat-area input {
            width: 100%;
            padding: 10px 16px;
            margin: 4px 0;
            border: 2px solid var(--input-border);
            border-radius: 30px;
            font-size: 0.95rem;
            background: var(--input-bg);
            color: var(--text);
        }
        .create-chat-area button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 30px;
            background: var(--secondary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            transition: 0.2s;
        }
        .create-chat-area button:hover { opacity: 0.85; }
        
        .announcement-item {
            background: var(--bg2);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid var(--border);
        }
        .announcement-item h3 { color: var(--text); margin-bottom: 6px; }
        .announcement-item p { color: var(--text-light); }
        .announcement-item small { color: var(--text-light); font-size: 0.7rem; }
        
        /* ===== ПОСТЫ ===== */
        .post-item {
            background: var(--bg2);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid var(--border);
            transition: 0.2s;
        }
        .post-item .post-author {
            font-weight: bold;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .post-item .post-author .online-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .post-item .post-author .online-indicator.online { background: #4a8a4a; }
        .post-item .post-author .online-indicator.offline { background: #b89a7a; }
        .post-item .post-time {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-left: 8px;
        }
        .post-item .post-text {
            margin-top: 8px;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .post-item .post-actions {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .post-item .post-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }
        .post-item .post-actions button:hover { color: var(--primary); }
        .post-item .post-actions .liked { color: #e84393; }
        .post-item .post-badge {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-left: 8px;
        }
        .post-item .post-badge.new { background: #4a8ad4; color: white; }
        .post-item .post-badge.popular { background: #f4a460; color: white; }
        .post-item .comments-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--input-border);
        }
        .post-item .comment-item {
            background: var(--chat-bg);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }
        .post-item .comment-item .comment-author {
            font-weight: bold;
            color: var(--text);
            font-size: 0.85rem;
        }
        .post-item .comment-item .comment-text {
            color: var(--text);
            font-size: 0.9rem;
            margin-top: 2px;
        }
        .post-item .comment-item .comment-time {
            font-size: 0.6rem;
            color: var(--text-light);
            float: right;
        }
        .post-item .add-comment-area {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .post-item .add-comment-area input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid var(--input-border);
            border-radius: 30px;
            font-size: 0.85rem;
            background: var(--input-bg);
            color: var(--text);
        }
        .post-item .add-comment-area button {
            background: var(--primary);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .create-post-area {
            background: var(--bg2);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .create-post-area textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 16px;
            background: var(--input-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 80px;
        }
        .create-post-area textarea:focus { outline: none; border-color: var(--border); }
        .create-post-area button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 30px;
            background: var(--secondary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .create-post-area button:hover { opacity: 0.85; }
        .create-post-area .disabled-msg {
            color: var(--text-light);
            font-size: 0.9rem;
            text-align: center;
            margin-top: 6px;
        }
        
        footer { text-align: center; color: var(--text-light); font-size: 0.7rem; margin-top: 28px; }
        
        @media (max-width: 500px) {
            .card { padding: 16px; }
            .top-bar { justify-content: center; }
            .chat-input-area { flex-direction: column; }
            .chat-input-area button { padding: 14px; }
            .tabs { gap: 6px; }
            .tab-btn { padding: 8px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <!-- ТОП-БАР -->
        <div class="top-bar">
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
            <button class="color-btn" style="background:#f4a460;" onclick="setColor('orange')" data-color="orange"></button>
            <button class="color-btn" style="background:#4a8ad4;" onclick="setColor('blue')" data-color="blue"></button>
            <button class="color-btn" style="background:#4aaf4a;" onclick="setColor('green')" data-color="green"></button>
            <button class="color-btn" style="background:#9b59b6;" onclick="setColor('purple')" data-color="purple"></button>
            <button class="color-btn" style="background:#e84393;" onclick="setColor('pink')" data-color="pink"></button>
        </div>
        
        <h1>🐟 Karasik Talk</h1>
        <div class="subtitle">🇺🇸 Карасикославия</div>
        
        <!-- Логин -->
        <div class="login-area" id="loginArea">
            <input type="text" id="loginInput" placeholder="Логин">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button class="login-btn" onclick="login()">🔑 Войти</button>
            <button class="register-btn" onclick="register()">📝 Регистрация</button>
            <div id="authStatus"></div>
        </div>
        
        <!-- Пользователь -->
        <div id="userInfo" class="user-info">
            <span class="uname" id="userName">Имя</span>
            <span class="urole" id="userRole">Роль</span>
            <span style="color:var(--text-light); font-size:0.8rem;" id="userLogin">@логин</span>
            <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chats')">💬 Чаты</button>
            <button class="tab-btn" onclick="switchTab('passport')">📋 Паспорт</button>
            <button class="tab-btn" onclick="switchTab('announcements')">📢 Новости</button>
            <button class="tab-btn" onclick="switchTab('posts')">📝 Посты</button>
        </div>
        
        <!-- Чаты -->
        <div id="tab-chats" class="tab-content active">
            <div class="create-chat-area">
                <input type="text" id="chatNameInput" placeholder="Название чата">
                <input type="text" id="chatMemberInput" placeholder="Добавить пользователя (логин)">
                <button onclick="createChat()">➕ Создать чат</button>
            </div>
            <div id="chatsList"><div class="loading">💬 Войдите, чтобы видеть чаты</div></div>
            
            <div id="chatView" style="display:none; margin-top:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap;">
                    <h3 id="currentChatName" style="color:var(--text);">Чат</h3>
                    <button onclick="leaveChat()" style="background:var(--danger); border:none; padding:6px 16px; border-radius:20px; color:white; cursor:pointer; font-size:0.8rem;">🚪 Покинуть</button>
                </div>
                <div id="chatMessages" class="chat-box"><div class="loading">💬 Загрузка...</div></div>
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="Напиши сообщение..." disabled>
                    <button onclick="sendMessage()" id="sendBtn" disabled>📤 Отправить</button>
                </div>
            </div>
        </div>
        
        <!-- Паспорт -->
        <div id="tab-passport" class="tab-content">
            <div id="passportDisplay"></div>
        </div>
        
        <!-- Новости -->
        <div id="tab-announcements" class="tab-content">
            <button onclick="loadAnnouncements()" style="background:var(--secondary); border:none; padding:10px 20px; border-radius:30px; color:white; font-weight:bold; cursor:pointer; margin-bottom:12px;">🔄 Загрузить новости</button>
            <div id="announcementsResult"><div class="loading">📢 Нажми "Загрузить новости"</div></div>
        </div>
        
        <!-- Посты -->
        <div id="tab-posts" class="tab-content">
            <div id="postsContainer">
                <div id="createPostArea" class="create-post-area" style="display:none;">
                    <textarea id="postInput" placeholder="Что нового? (макс 500 символов)" maxlength="500"></textarea>
                    <button onclick="createPost()">📝 Опубликовать пост</button>
                    <div class="disabled-msg" id="postDisabledMsg"></div>
                </div>
                <div id="postsList"><div class="loading">📝 Загрузка постов...</div></div>
            </div>
        </div>
        
    </div>
    <footer>🐟 Карасикославия · Все данные в Firebase 🔥</footer>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getDatabase, ref, get, set, push, onValue, serverTimestamp, update, remove } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyCCyxK7YqIPmgYfhfU4FtcVS9IVuxNWh78",
        authDomain: "karasik-talk.firebaseapp.com",
        projectId: "karasik-talk",
        storageBucket: "karasik-talk.firebasestorage.app",
        messagingSenderId: "537134768449",
        appId: "1:537134768449:web:26f564477daa20e4d241c0",
        measurementId: "G-Y3QQCBM7DV"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    
    const DB_URL = 'https://karasik-talk-default-rtdb.europe-west1.firebasedatabase.app';
    
    // ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====
    window.currentUser = null;
    window.currentChatId = null;
    window.updateInterval = null;
    
    // ===== ТЕМА =====
    window.toggleTheme = function() {
        const current = document.documentElement.getAttribute('data-theme');
        const newTheme = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('karasik-theme', newTheme);
        document.querySelector('.theme-btn').textContent = newTheme === 'dark' ? '☀️' : '🌙';
    };
    
    window.setColor = function(color) {
        document.documentElement.setAttribute('data-color', color);
        localStorage.setItem('karasik-color', color);
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.color-btn[data-color="${color}"]`)?.classList.add('active');
    };
    
    const savedTheme = localStorage.getItem('karasik-theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.querySelector('.theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    
    const savedColor = localStorage.getItem('karasik-color') || 'orange';
    document.documentElement.setAttribute('data-color', savedColor);
    document.querySelector(`.color-btn[data-color="${savedColor}"]`)?.classList.add('active');
    
    // ===== API =====
    async function apiFetch(path) {
        const res = await fetch(`${DB_URL}/all/${path}.json`);
        return res.json();
    }
    
    async function apiPut(path, data) {
        const res = await fetch(`${DB_URL}/all/${path}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return res.json();
    }
    
    // ===== РЕГИСТРАЦИЯ =====
    window.register = async function() {
        const login = document.getElementById('loginInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const status = document.getElementById('authStatus');
        
        if (!login || !password) {
            status.innerHTML = '<div class="error-box">❌ Заполните логин и пароль</div>';
            return;
        }
        
        try {
            const users = await apiFetch('users');
            if (users && users[login]) {
                status.innerHTML = '<div class="error-box">❌ Пользователь уже существует</div>';
                return;
            }
            
            await apiPut(`users/${login}`, {
                password: password,
                passport: { fullName: login, role: 'Обычный карасик', birthDate: '' },
                createdAt: new Date().toISOString(),
                chats: []
            });
            
            status.innerHTML = '<div class="success-box">✅ Регистрация успешна! Теперь войдите.</div>';
        } catch(e) {
            status.innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
        }
    };
    
    // ===== ЛОГИН =====
    window.login = async function() {
        const login = document.getElementById('loginInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const status = document.getElementById('authStatus');
        
        if (!login || !password) {
            status.innerHTML = '<div class="error-box">❌ Введите логин и пароль</div>';
            return;
        }
        
        try {
            const user = await apiFetch(`users/${login}`);
            if (!user) {
                status.innerHTML = '<div class="error-box">❌ Пользователь не найден</div>';
                return;
            }
            if (user.password !== password) {
                status.innerHTML = '<div class="error-box">❌ Неверный пароль</div>';
                return;
            }
            
            window.currentUser = { login, ...user };
            localStorage.setItem('karasik_user_login', login);
            
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('loginArea').style.display = 'none';
            status.innerHTML = '';
            
            showPassport();
            loadChats();
            loadPosts();
            showCreatePostArea();
        } catch(e) {
            status.innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
        }
    };
    
    // ===== ВЫХОД =====
    window.logout = function() {
        window.currentUser = null;
        window.currentChatId = null;
        localStorage.removeItem('karasik_user_login');
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('loginArea').style.display = 'block';
        document.getElementById('chatView').style.display = 'none';
        document.getElementById('chatsList').innerHTML = '<div class="loading">💬 Войдите, чтобы видеть чаты</div>';
        if (window.updateInterval) { clearInterval(window.updateInterval); window.updateInterval = null; }
        document.getElementById('createPostArea').style.display = 'none';
        document.getElementById('postsList').innerHTML = '<div class="loading">📝 Войдите, чтобы видеть посты</div>';
    };
    
    // ===== ПАСПОРТ =====
    function showPassport() {
        const container = document.getElementById('passportDisplay');
        const p = window.currentUser.passport;
        
        if (!p || !p.fullName) {
            container.innerHTML = `<div style="background:#fff3cd; border-radius:16px; padding:16px; color:#856404; border:1px solid #ffc107;">⚠️ У вас нет паспорта. Обратитесь к администратору.</div>`;
            return;
        }
        
        container.innerHTML = `
            <div class="passport-card">
                <div class="badge">🇺🇸 УДОСТОВЕРЕНИЕ ЛИЧНОСТИ</div>
                <div class="name">${escapeHtml(p.fullName)}</div>
                <div class="detail"><span class="label">👤 Логин</span><span>${escapeHtml(window.currentUser.login)}</span></div>
                <div class="detail"><span class="label">🏷️ Роль</span><span><span class="role-tag">${escapeHtml(p.role || 'Обычный карасик')}</span></span></div>
                <div class="detail"><span class="label">📅 Дата рождения</span><span>${escapeHtml(p.birthDate || '—')}</span></div>
                <div style="margin-top:16px; text-align:center; font-size:0.8rem; color:var(--text-light);">🐟 Карасикославия</div>
            </div>
        `;
        
        document.getElementById('userName').textContent = p.fullName || window.currentUser.login;
        document.getElementById('userRole').textContent = p.role || 'Обычный карасик';
        document.getElementById('userLogin').textContent = `@${window.currentUser.login}`;
    }
    
    // ===== ЧАТЫ =====
    async function loadChats() {
        if (!window.currentUser) return;
        const container = document.getElementById('chatsList');
        container.innerHTML = '🔄 Загрузка...';
        
        try {
            const chats = await apiFetch('chats') || {};
            const userChats = [];
            for (const [id, chat] of Object.entries(chats)) {
                if (chat.members && chat.members.includes(window.currentUser.login)) {
                    userChats.push({ id, ...chat });
                }
            }
            
            if (userChats.length === 0) {
                container.innerHTML = '<div class="loading">💬 Ты не участвуешь ни в одном чате</div>';
                return;
            }
            
            container.innerHTML = userChats.map(chat => `
                <div class="chat-list-item" onclick="openChat('${chat.id}')">
                    <span class="cname">${escapeHtml(chat.name)}</span>
                    <span class="cmembers">👥 ${chat.members ? chat.members.join(', ') : ''}</span>
                </div>
            `).join('');
        } catch(e) {
            container.innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
        }
    }
    
    window.createChat = async function() {
        if (!window.currentUser) { showNotification('Сначала войдите!', '❌'); return; }
        
        const name = document.getElementById('chatNameInput').value.trim();
        const member = document.getElementById('chatMemberInput').value.trim();
        
        if (!name || !member) { showNotification('Заполните все поля', '❌'); return; }
        if (member === window.currentUser.login) { showNotification('Нельзя добавить самого себя', '❌'); return; }
        
        try {
            const users = await apiFetch('users');
            if (!users || !users[member]) {
                showNotification(`Пользователь "${member}" не найден`, '❌');
                return;
            }
            
            const chatId = Date.now().toString();
            const chatData = {
                name: name,
                members: [window.currentUser.login, member],
                createdBy: window.currentUser.login,
                createdAt: new Date().toISOString(),
                messages: {}
            };
            
            await apiPut(`chats/${chatId}`, chatData);
            
            const userChats = window.currentUser.chats || [];
            userChats.push(chatId);
            await apiPut(`users/${window.currentUser.login}/chats`, userChats);
            window.currentUser.chats = userChats;
            
            const memberChats = users[member].chats || [];
            memberChats.push(chatId);
            await apiPut(`users/${member}/chats`, memberChats);
            
            document.getElementById('chatNameInput').value = '';
            document.getElementById('chatMemberInput').value = '';
            
            loadChats();
            showNotification(`Чат "${name}" создан! 🎉`, '✅');
        } catch(e) {
            showNotification(`Ошибка: ${e.message}`, '❌');
        }
    };
    
    window.openChat = function(chatId) {
        window.currentChatId = chatId;
        document.getElementById('chatView').style.display = 'block';
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        
        loadMessages(chatId);
        if (window.updateInterval) clearInterval(window.updateInterval);
        window.updateInterval = setInterval(() => {
            if (window.currentChatId === chatId) loadMessages(chatId, true);
        }, 3000);
    };
    
    async function loadMessages(chatId, silent = false) {
        const container = document.getElementById('chatMessages');
        const nameEl = document.getElementById('currentChatName');
        
        try {
            const chat = await apiFetch(`chats/${chatId}`);
            if (!chat) { container.innerHTML = '<div class="error-box">❌ Чат не найден</div>'; return; }
            
            nameEl.textContent = chat.name || 'Чат';
            const messages = chat.messages || {};
            const keys = Object.keys(messages);
            
            if (keys.length === 0) {
                if (!silent) container.innerHTML = '<div class="loading">💬 Сообщений пока нет</div>';
                return;
            }
            
            const sorted = keys.sort((a, b) => (messages[a].timestamp || 0) - (messages[b].timestamp || 0));
            let html = sorted.map(id => {
                const m = messages[id];
                return `
                    <div class="message-item">
                        <span class="msg-user">${escapeHtml(m.from)}</span>
                        <span class="msg-time">${m.timestamp ? new Date(m.timestamp).toLocaleString() : ''}</span>
                        <div class="msg-text">${escapeHtml(m.text)}</div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        } catch(e) {
            if (!silent) container.innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
        }
    }
    
    window.sendMessage = async function() {
        if (!window.currentUser || !window.currentChatId) {
            showNotification('Выберите чат', '❌');
            return;
        }
        
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        
        try {
            const chat = await apiFetch(`chats/${window.currentChatId}`);
            if (!chat) { showNotification('Чат не найден', '❌'); return; }
            
            const messages = chat.messages || {};
            const id = Date.now().toString();
            messages[id] = {
                from: window.currentUser.login,
                text: text,
                timestamp: Date.now()
            };
            
            await apiPut(`chats/${window.currentChatId}/messages`, messages);
            
            input.value = '';
            loadMessages(window.currentChatId);
        } catch(e) {
            showNotification(`Ошибка: ${e.message}`, '❌');
        }
    };
    
    window.leaveChat = async function() {
        if (!window.currentChatId) return;
        if (!confirm('Покинуть чат?')) return;
        
        try {
            const userChats = window.currentUser.chats || [];
            const updated = userChats.filter(id => id !== window.currentChatId);
            await apiPut(`users/${window.currentUser.login}/chats`, updated);
            window.currentUser.chats = updated;
            
            window.currentChatId = null;
            document.getElementById('chatView').style.display = 'none';
            document.getElementById('messageInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            if (window.updateInterval) { clearInterval(window.updateInterval); window.updateInterval = null; }
            loadChats();
        } catch(e) {
            showNotification(`Ошибка: ${e.message}`, '❌');
        }
    };
    
    // ===== НОВОСТИ =====
    window.loadAnnouncements = async function() {
        const container = document.getElementById('announcementsResult');
        container.innerHTML = '🔄 Загрузка...';
        try {
            const data = await apiFetch('announcements') || {};
            const items = Object.values(data).filter(a => a !== null && a.active !== false);
            
            if (items.length === 0) {
                container.innerHTML = '<div class="error-box">📭 Нет активных новостей</div>';
                return;
            }
            
            container.innerHTML = items.map(a => `
                <div class="announcement-item">
                    <h3>📌 ${escapeHtml(a.title)}</h3>
                    <p>${escapeHtml(a.text)}</p>
                    <small>📅 ${escapeHtml(a.date || 'Недавно')}</small>
                </div>
            `).join('');
        } catch(e) {
            container.innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
        }
    };
    
    // ===== ПОСТЫ =====
    function showCreatePostArea() {
        const container = document.getElementById('createPostArea');
        if (window.currentUser && window.currentUser.passport && window.currentUser.passport.fullName) {
            container.style.display = 'block';
            document.getElementById('postDisabledMsg').textContent = '';
        } else {
            container.style.display = 'block';
            document.getElementById('postDisabledMsg').textContent = '⚠️ У вас нет паспорта, вы не можете создавать посты.';
            document.getElementById('postInput').disabled = true;
            // остальное не блокируем, но кнопка будет работать, проверим
        }
    }
    
    async function loadPosts() {
        const container = document.getElementById('postsList');
        container.innerHTML = '🔄 Загрузка...';
        
        try {
            const posts = await apiFetch('posts') || {};
            const keys = Object.keys(posts);
            if (keys.length === 0) {
                container.innerHTML = '<div class="loading">📝 Нет постов. Будь первым!</div>';
                return;
            }
            
            // Сортируем по времени (новые сверху)
            const sortedKeys = keys.sort((a, b) => (posts[b].timestamp || 0) - (posts[a].timestamp || 0));
            
            // Проверяем онлайн статус для авторов
            const onlineStatuses = {};
            for (const key of sortedKeys) {
                const author = posts[key].author;
                if (author && !onlineStatuses[author]) {
                    try {
                        const status = await apiFetch(`users/${author}/online`) || {};
                        onlineStatuses[author] = status.status === 'online';
                    } catch(e) { onlineStatuses[author] = false; }
                }
            }
            
            let html = '';
            for (const key of sortedKeys) {
                const post = posts[key];
                const isOnline = onlineStatuses[post.author] || false;
                const likesCount = post.likes || 0;
                const comments = post.comments || {};
                const commentKeys = Object.keys(comments);
                const timeAgo = getTimeAgo(post.timestamp);
                const isNew = (Date.now() - (post.timestamp || 0)) < 3600000; // 1 час
                const isPopular = likesCount >= 5;
                
                let badgeHtml = '';
                if (isNew) badgeHtml = `<span class="post-badge new">Новый</span>`;
                if (isPopular) badgeHtml += `<span class="post-badge popular">🔥 Популярный</span>`;
                
                const isLiked = window.currentUser && post.likedBy && post.likedBy[window.currentUser.login];
                
                html += `
                    <div class="post-item" data-postid="${key}">
                        <div class="post-author">
                            <span>${escapeHtml(post.author)}</span>
                            <span class="online-indicator ${isOnline ? 'online' : 'offline'}"></span>
                            ${badgeHtml}
                            <span class="post-time">${timeAgo}</span>
                        </div>
                        <div class="post-text">${escapeHtml(post.text)}</div>
                        <div class="post-actions">
                            <button onclick="likePost('${key}')" class="${isLiked ? 'liked' : ''}">
                                ❤️ <span id="likes-${key}">${likesCount}</span>
                            </button>
                            <button onclick="toggleComments('${key}')">
                                💬 <span id="comments-count-${key}">${commentKeys.length}</span>
                            </button>
                        </div>
                        <div class="comments-section" id="comments-${key}" style="display:none;">
                            ${commentKeys.map(cid => {
                                const c = comments[cid];
                                return `
                                    <div class="comment-item">
                                        <span class="comment-author">${escapeHtml(c.author)}</span>
                                        <span class="comment-time">${getTimeAgo(c.timestamp)}</span>
                                        <div class="comment-text">${escapeHtml(c.text)}</div>
                                    </div>
                                `;
                            }).join('')}
                            <div class="add-comment-area">
                                <input type="text" placeholder="Написать комментарий..." id="comment-input-${key}">
                                <button onclick="addComment('${key}')">📤</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } catch(e) {
            container.innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
        }
    }
    
    window.createPost = async function() {
        if (!window.currentUser) {
            showNotification('Сначала войдите!', '❌');
            return;
        }
        if (!window.currentUser.passport || !window.currentUser.passport.fullName) {
            showNotification('У вас нет паспорта!', '❌');
            return;
        }
        
        const input = document.getElementById('postInput');
        const text = input.value.trim();
        if (!text) return;
        if (text.length > 500) {
            showNotification('Максимум 500 символов', '❌');
            return;
        }
        
        try {
            const postId = Date.now().toString();
            const newPost = {
                author: window.currentUser.login,
                text: text,
                timestamp: Date.now(),
                likes: 0,
                likedBy: {},
                comments: {}
            };
            
            await apiPut(`posts/${postId}`, newPost);
            input.value = '';
            loadPosts();
            showNotification('Пост опубликован! 📝', '✅');
        } catch(e) {
            showNotification(`Ошибка: ${e.message}`, '❌');
        }
    };
    
    window.likePost = async function(postId) {
        if (!window.currentUser) {
            showNotification('Сначала войдите!', '❌');
            return;
        }
        
        try {
            const post = await apiFetch(`posts/${postId}`);
            if (!post) { showNotification('Пост не найден', '❌'); return; }
            
            const likedBy = post.likedBy || {};
            const isLiked = likedBy[window.currentUser.login];
            let likes = post.likes || 0;
            
            if (isLiked) {
                delete likedBy[window.currentUser.login];
                likes--;
            } else {
                likedBy[window.currentUser.login] = true;
                likes++;
            }
            
            await apiPut(`posts/${postId}/likes`, likes);
            await apiPut(`posts/${postId}/likedBy`, likedBy);
            
            loadPosts();
        } catch(e) {
            showNotification(`Ошибка: ${e.message}`, '❌');
        }
    };
    
    window.toggleComments = function(postId) {
        const section = document.getElementById(`comments-${postId}`);
        if (section.style.display === 'none') {
            section.style.display = 'block';
        } else {
            section.style.display = 'none';
        }
    };
    
    window.addComment = async function(postId) {
        if (!window.currentUser) {
            showNotification('Сначала войдите!', '❌');
            return;
        }
        
        const input = document.getElementById(`comment-input-${postId}`);
        const text = input.value.trim();
        if (!text) return;
        
        try {
            const post = await apiFetch(`posts/${postId}`);
            if (!post) { showNotification('Пост не найден', '❌'); return; }
            
            const comments = post.comments || {};
            const commentId = Date.now().toString();
            comments[commentId] = {
                author: window.currentUser.login,
                text: text,
                timestamp: Date.now()
            };
            
            await apiPut(`posts/${postId}/comments`, comments);
            input.value = '';
            loadPosts();
        } catch(e) {
            showNotification(`Ошибка: ${e.message}`, '❌');
        }
    };
    
    // ===== ВРЕМЯ =====
    function getTimeAgo(timestamp) {
        if (!timestamp) return 'только что';
        const diff = Date.now() - timestamp;
        const seconds = Math.floor(diff / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);
        
        if (seconds < 60) return `${seconds} сек назад`;
        if (minutes < 60) return `${minutes} мин назад`;
        if (hours < 24) return `${hours} ч назад`;
        return `${days} дн назад`;
    }
    
    // ===== УВЕДОМЛЕНИЯ =====
    function showNotification(message, icon = '🐟') {
        // Можно использовать браузерные уведомления или тосты
        console.log(`${icon} ${message}`);
        // Здесь можно добавить всплывающее уведомление
    }
    
    // ===== ВКЛАДКИ =====
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
        if (tab === 'posts' && window.currentUser) {
            loadPosts();
            showCreatePostArea();
        }
    };
    
    // ===== UTILS =====
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    
    // ===== АВТОВХОД =====
    async function autoLogin() {
        const saved = localStorage.getItem('karasik_user_login');
        if (saved) {
            document.getElementById('loginInput').value = saved;
            try {
                const user = await apiFetch(`users/${saved}`);
                if (user) {
                    window.currentUser = { login: saved, ...user };
                    document.getElementById('userInfo').style.display = 'flex';
                    document.getElementById('loginArea').style.display = 'none';
                    showPassport();
                    loadChats();
                    loadPosts();
                    showCreatePostArea();
                }
            } catch(e) {}
        }
    }
    
    autoLogin();
</script>
