<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐟 Karasik Talk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0e6d3 0%, #ffe8d0 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,180,100,0.3);
        }
        h1 {
            color: #6b4a3a;
            font-size: 2rem;
            border-left: 5px solid #f4a460;
            padding-left: 16px;
            margin-bottom: 8px;
        }
        .subtitle { color: #8b6b4a; padding-left: 16px; margin-bottom: 20px; }
        
        .login-area {
            background: #f8efe0;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .login-area input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 2px solid #f0d5b0;
            border-radius: 30px;
            font-size: 1rem;
        }
        .login-area input:focus { outline: none; border-color: #f4a460; }
        .login-area button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }
        .login-area .login-btn { background: #f4a460; color: white; }
        .login-area .register-btn { background: #1a6a8a; color: white; }
        
        .user-info {
            background: #e8f5e8;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .user-info .uname { font-weight: bold; color: #6b4a3a; }
        .user-info .urole {
            background: #f4a460;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }
        .user-info .logout-btn {
            background: #dc2626;
            border: none;
            padding: 4px 16px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }
        
        .error-box { background: #fff1f0; border-radius: 16px; padding: 12px; color: #b34e3a; border: 1px solid #ffc6be; margin-top: 8px; }
        .success-box { background: #d4edda; border-radius: 16px; padding: 12px; color: #155724; border: 1px solid #c3e6cb; margin-top: 8px; }
        
        footer { text-align: center; color: #c4a88a; font-size: 0.7rem; margin-top: 28px; }
        
        .passport-card {
            background: linear-gradient(140deg, #fff8f0, #ffe8d0);
            border-radius: 32px;
            padding: 20px;
            border: 2px solid #f4a460;
            margin-top: 12px;
        }
        .passport-card .badge {
            background: #f4a460;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            color: #4a3a2a;
            margin-bottom: 18px;
        }
        .passport-card .name { font-size: 1.8rem; font-weight: 700; color: #6b4a3a; }
        .passport-card .detail {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 1px dashed #e8c8a8;
            padding: 12px 0;
        }
        .passport-card .label { font-weight: 600; color: #b4885a; }
        .passport-card .role-tag {
            display: inline-block;
            background: #f4a460;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🐟 Karasik Talk</h1>
        <div class="subtitle">🇺🇸 Карасикославия · Страна мирных карасей</div>
        
        <!-- Логин -->
        <div class="login-area" id="loginArea">
            <input type="text" id="loginInput" placeholder="Логин">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button class="login-btn" onclick="loginUser()">🔑 Войти</button>
            <button class="register-btn" onclick="registerUser()">📝 Зарегистрироваться</button>
            <div id="authStatus"></div>
        </div>
        
        <!-- Пользователь -->
        <div id="userInfo" class="user-info">
            <span class="uname" id="userName">Имя</span>
            <span class="urole" id="userRole">Роль</span>
            <span style="color:#6b4a3a; font-size:0.8rem;" id="userLogin">@логин</span>
            <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
        </div>
        
        <!-- Паспорт -->
        <div id="passportDisplay" style="display:none;"></div>
        
    </div>
    <footer>🐟 Карасикославия · Все данные в Firebase 🔥</footer>
</div>

<script>
    const DB_URL = 'https://karasik-talk-default-rtdb.europe-west1.firebasedatabase.app';
    let currentUser = null;
    
    // ===== РЕГИСТРАЦИЯ =====
    window.registerUser = async function() {
        const login = document.getElementById('loginInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const status = document.getElementById('authStatus');
        
        if (!login || !password) {
            status.innerHTML = '<div class="error-box">❌ Заполните логин и пароль</div>';
            return;
        }
        if (login.length < 3) {
            status.innerHTML = '<div class="error-box">❌ Логин минимум 3 символа</div>';
            return;
        }
        if (password.length < 4) {
            status.innerHTML = '<div class="error-box">❌ Пароль минимум 4 символа</div>';
            return;
        }
        
        try {
            const res = await fetch(`${DB_URL}/all/users/${login}.json`);
            const existing = await res.json();
            
            if (existing) {
                status.innerHTML = '<div class="error-box">❌ Пользователь уже существует</div>';
                return;
            }
            
            // Создаём пользователя с пустым паспортом (админ заполнит)
            await fetch(`${DB_URL}/all/users/${login}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    password: password,
                    passport: null,
                    createdAt: new Date().toISOString(),
