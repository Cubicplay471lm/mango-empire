<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐟 Karasik Talk - Карасикославия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0e6d3 0%, #ffe8d0 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,180,100,0.3);
        }
        h1 {
            color: #6b4a3a;
            font-size: 2rem;
            border-left: 5px solid #f4a460;
            padding-left: 16px;
            margin-bottom: 8px;
        }
        .subtitle { color: #8b6b4a; padding-left: 16px; margin-bottom: 20px; }
        
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            background: #f0d5b0;
            color: #6b4a3a;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #f4a460;
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .search-area {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #f0d5b0;
            border-radius: 30px;
            font-size: 1rem;
            font-family: inherit;
        }
        .search-area input:focus {
            outline: none;
            border-color: #f4a460;
        }
        .search-area button {
            background: #f4a460;
            border: none;
            padding: 0 24px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .passport-card {
            background: linear-gradient(140deg, #fff8f0, #ffe8d0);
            border-radius: 32px;
            padding: 20px;
            border: 2px solid #f4a460;
            margin-top: 12px;
        }
        .passport-card .badge {
            background: #f4a460;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            color: #4a3a2a;
            margin-bottom: 18px;
        }
        .passport-card .name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #6b4a3a;
        }
        .passport-card .detail {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 1px dashed #e8c8a8;
            padding: 12px 0;
        }
        .passport-card .label { font-weight: 600; color: #b4885a; }
        .passport-card .role-tag {
            display: inline-block;
            background: #f4a460;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }
        
        .announcement-item {
            background: #fff8f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #f4a460;
        }
        .announcement-item h3 { color: #c4884a; margin-bottom: 6px; }
        .announcement-item p { color: #6b5a4a; }
        .announcement-item small { color: #b89a7a; font-size: 0.7rem; }
        
        .message-item {
            background: #f8f0e8;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 4px solid #1a6a8a;
        }
        .message-item .msg-user { font-weight: bold; color: #6b4a3a; }
        .message-item .msg-role {
            background: #f4a460;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: white;
            font-weight: bold;
            margin-left: 6px;
        }
        .message-item .msg-time { font-size: 0.65rem; color: #b89a7a; float: right; }
        .message-item .msg-text { margin-top: 4px; color: #4a3a2a; }
        
        .load-btn {
            background: #1a6a8a;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .load-btn:hover { background: #0a4a6a; }
        
        .error-box {
            background: #fff1f0;
            border-radius: 16px;
            padding: 16px;
            color: #b34e3a;
            border: 1px solid #ffc6be;
        }
        .loading { text-align: center; padding: 20px; color: #c4885a; }
        
        footer { text-align: center; color: #c4a88a; font-size: 0.7rem; margin-top: 28px; }
        
        .passport-list-item {
            background: #f8efe0;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 3px solid #f4a460;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .passport-list-item .pname { font-weight: bold; color: #6b4a3a; }
        .passport-list-item .prole {
            background: #f4a460;
            padding: 1px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: white;
            font-weight: bold;
        }
        .passport-list-item .pcode {
            font-family: monospace;
            color: #b4885a;
            font-size: 0.8rem;
        }
        
        .chat-input-area {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #f0d5b0;
            border-radius: 40px;
            font-size: 1rem;
            font-family: inherit;
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: #f4a460;
        }
        .chat-input-area button {
            background: #f4a460;
            border: none;
            padding: 0 28px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .chat-input-area button:active { transform: scale(0.96); }
        
        .user-badge {
            background: #e8f5e8;
            padding: 8px 16px;
            border-radius: 30px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .user-badge .uname { font-weight: bold; color: #6b4a3a; }
        .user-badge .urole {
            background: #f4a460;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }
        .user-badge .logout-btn {
            background: #dc2626;
            border: none;
            padding: 4px 16px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .user-badge .login-hint {
            color: #b4885a;
            font-size: 0.9rem;
        }
        .auto-update-badge {
            background: #4a8a4a;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            margin-left: 12px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @media (max-width: 500px) {
            .card { padding: 16px; }
            .tabs { gap: 6px; }
            .tab-btn { padding: 8px 14px; font-size: 0.8rem; }
            .search-area { flex-direction: column; }
            .passport-card .name { font-size: 1.2rem; }
            .passport-list-item { flex-direction: column; align-items: flex-start; gap: 4px; }
            .chat-input-area { flex-direction: column; }
            .chat-input-area button { padding: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🐟 Karasik Talk <span class="auto-update-badge">🔄 LIVE</span></h1>
        <div class="subtitle">🇺🇸 Карасикославия · Страна мирных карасей</div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('passports')">📋 Паспорта</button>
            <button class="tab-btn" onclick="switchTab('announcements')">📢 Новости</button>
            <button class="tab-btn" onclick="switchTab('messages')">💬 Чат</button>
        </div>
        
        <!-- Паспорта -->
        <div id="tab-passports" class="tab-content active">
            <div class="search-area">
                <input type="text" id="passportInput" placeholder="Введите код, например 171">
                <button onclick="findPassport()">🔍 Найти</button>
            </div>
            <button class="load-btn" onclick="loadPassports()">🔄 Показать всех граждан</button>
            <div id="passportsResult"><div class="loading">🐟 Нажми "Показать всех граждан"</div></div>
        </div>
        
        <!-- Новости -->
        <div id="tab-announcements" class="tab-content">
            <button class="load-btn" onclick="loadAnnouncements()">🔄 Загрузить новости</button>
            <div id="announcementsResult"><div class="loading">📢 Нажми "Загрузить новости"</div></div>
        </div>
        
        <!-- Чат -->
        <div id="tab-messages" class="tab-content">
            <div id="userBadge" class="user-badge">
                <span class="login-hint">🔑 Введи код паспорта ниже, чтобы писать в чат</span>
            </div>
            
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <input type="text" id="chatLoginInput" placeholder="Код паспорта" style="flex:1; padding:10px 16px; border:2px solid #f0d5b0; border-radius:30px; font-size:0.9rem;">
                <button onclick="loginToChat()" style="background:#1a6a8a; border:none; padding:0 20px; border-radius:30px; color:white; font-weight:bold; cursor:pointer;">🎣 Войти</button>
            </div>
            
            <div id="messagesContainer">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:8px;">
                    <span style="color:#6b4a3a; font-size:0.9rem;">💬 Сообщения обновляются автоматически</span>
                    <span style="color:#4a8a4a; font-size:0.8rem;" id="updateStatus">🟢 в реальном времени</span>
                </div>
                <div id="messagesResult"><div class="loading">💬 Загрузка сообщений...</div></div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Войди в чат по паспорту" disabled>
                <button onclick="sendMessage()" id="sendBtn" disabled>📤 Отправить</button>
            </div>
        </div>
    </div>
    <footer>🐟 Карасикославия · Данные из Firebase 🔥</footer>
</div>

<script>
    const DB_URL = 'https://karasik-talk-default-rtdb.europe-west1.firebasedatabase.app';
    let currentUser = null;
    let updateInterval = null;
    let lastMessageCount = 0;
    
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
        
        if (tab === 'messages') {
            startAutoUpdate();
        } else {
            stopAutoUpdate();
        }
    };
    
    // ===== АВТООБНОВЛЕНИЕ =====
    function startAutoUpdate() {
        if (updateInterval) return;
        loadMessages();
        updateInterval = setInterval(() => {
            loadMessages(true);
        }, 5000);
        console.log('🔄 Автообновление чата запущено');
    }
    
    function stopAutoUpdate() {
        if (updateInterval) {
            clearInterval(updateInterval);
            updateInterval = null;
            console.log('⏹️ Автообновление чата остановлено');
        }
    }
    
    // ===== ПАСПОРТА =====
    window.loadPassports = async function() {
        const container = document.getElementById('passportsResult');
        container.innerHTML = '🔄 Загрузка...';
        try {
            const res = await fetch(`${DB_URL}/all/passports.json`);
            const data = await res.json();
            console.log('📋 Загружены паспорта:', data);
            if (data && Object.keys(data).length > 0) {
                const codes = Object.keys(data);
                container.innerHTML = `
                    <div style="color:#4a8a4a; margin-bottom:12px;">✅ Всего граждан: ${codes.length}</div>
                    ${codes.map(code => {
                        const p = data[code];
                        return `
                            <div class="passport-list-item">
                                <span class="pname">${escapeHtml(p.fullName)}</span>
                                <span class="prole">${escapeHtml(p.role || 'Обычный карасик')}</span>
                                <span class="pcode">#${escapeHtml(code)}</span>
                            </div>
                        `;
                    }).join('')}
                `;
            } else {
                container.innerHTML = '<div class="error-box">❌ Граждан не найдено. Добавь паспорта в админке.</div>';
            }
        } catch(e) {
            console.error('❌ Ошибка загрузки паспортов:', e);
            container.innerHTML = `<div class="error-box">❌ Ошибка: ${e.message}</div>`;
        }
    };
    
    window.findPassport = async function() {
        const code = document.getElementById('passportInput').value.trim();
        const container = document.getElementById('passportsResult');
        if (!code) { container.innerHTML = '<div class="error-box">🔎 Введите код</div>'; return; }
        container.innerHTML = '🔄 Поиск...';
        try {
            const res = await fetch(`${DB_URL}/all/passports/${code}.json`);
            const data = await res.json();
            console.log(`🔍 Поиск паспорта ${code}:`, data);
            if (data) {
                container.innerHTML = `
                    <div class="passport-card">
                        <div class="badge">🇺🇸 УДОСТОВЕРЕНИЕ ЛИЧНОСТИ</div>
                        <div class="name">${escapeHtml(data.fullName)}</div>
                        <div class="detail"><span class="label">🎫 Код</span><span style="font-weight:bold;">${escapeHtml(code)}</span></div>
                        <div class="detail"><span class="label">📅 Дата рождения</span><span>${escapeHtml(data.birthDate)}</span></div>
                        <div class="detail"><span class="label">🏷️ Роль</span><span><span class="role-tag">${escapeHtml(data.role || 'Обычный карасик')}</span></span></div>
                        <div style="margin-top:16px; text-align:center; font-size:0.8rem; color:#c4885a;">🐟 Карасикославия</div>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="error-box">❌ Гражданин с кодом "${code}" не найден</div>`;
            }
        } catch(e) {
            console.error('❌ Ошибка поиска:', e);
            container.innerHTML = `<div class="error-box">❌ Ошибка: ${e.message}</div>`;
        }
    };
    
    // ===== НОВОСТИ =====
    window.loadAnnouncements = async function() {
        const container = document.getElementById('announcementsResult');
        container.innerHTML = '🔄 Загрузка...';
        try {
            const res = await fetch(`${DB_URL}/all/announcements.json`);
            const data = await res.json();
            if (data) {
                const items = Object.values(data).filter(a => a !== null && a.active !== false);
                if (items.length > 0) {
                    container.innerHTML = items.map(a => `
                        <div class="announcement-item">
                            <h3>📌 ${escapeHtml(a.title)}</h3>
                            <p>${escapeHtml(a.text)}</p>
                            <small>📅 ${escapeHtml(a.date || 'Недавно')}</small>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="error-box">📭 Нет активных новостей</div>';
                }
            } else {
                container.innerHTML = '<div class="error-box">❌ Новостей нет</div>';
            }
        } catch(e) {
            container.innerHTML = `<div class="error-box">❌ Ошибка: ${e.message}</div>`;
        }
    };
    
    // ===== ЧАТ =====
    
    window.loginToChat = async function() {
        const code = document.getElementById('chatLoginInput').value.trim();
        if (!code) {
            alert('❌ Введите код паспорта');
            return;
        }
        
        try {
            const res = await fetch(`${DB_URL}/all/passports/${code}.json`);
            const data = await res.json();
            
            if (data) {
                currentUser = {
                    code: code,
                    fullName: data.fullName || 'Неизвестный',
                    role: data.role || 'Обычный карасик'
                };
                
                document.getElementById('userBadge').innerHTML = `
                    <span class="uname">${escapeHtml(currentUser.fullName)}</span>
                    <span class="urole">${escapeHtml(currentUser.role)}</span>
                    <span style="color:#b4885a; font-size:0.8rem;">#${escapeHtml(currentUser.code)}</span>
                    <button class="logout-btn" onclick="logoutFromChat()">🚪 Выйти</button>
                `;
                
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('messageInput').placeholder = 'Напиши сообщение...';
                document.getElementById('chatLoginInput').value = '';
                
                startAutoUpdate();
                alert(`✅ Добро пожаловать, ${currentUser.fullName}! 🐟`);
            } else {
                alert(`❌ Паспорт с кодом "${code}" не найден!`);
            }
        } catch(e) {
            alert(`❌ Ошибка: ${e.message}`);
        }
    };
    
    window.logoutFromChat = function() {
        currentUser = null;
        document.getElementById('userBadge').innerHTML = `
            <span class="login-hint">🔑 Введи код паспорта ниже, чтобы писать в чат</span>
        `;
        document.getElementById('messageInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('messageInput').placeholder = 'Войди в чат по паспорту';
        stopAutoUpdate();
    };
    
    window.sendMessage = async function() {
        if (!currentUser) {
            alert('❌ Сначала войди в чат по паспорту!');
            return;
        }
        
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        
        try {
            const messagesRef = await fetch(`${DB_URL}/all/messages.json`);
            const messages = await messagesRef.json();
            
            let newId = Date.now().toString();
            const newMessage = {
                username: currentUser.fullName,
                role: currentUser.role,
                text: text,
                timestamp: Date.now()
            };
            
            const updated = messages || {};
            updated[newId] = newMessage;
            
            await fetch(`${DB_URL}/all/messages.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updated)
            });
            
            input.value = '';
            loadMessages(true);
        } catch(e) {
            alert(`❌ Ошибка отправки: ${e.message}`);
        }
    };
    
    window.loadMessages = async function(silent = false) {
        const container = document.getElementById('messagesResult');
        if (!silent) container.innerHTML = '🔄 Загрузка...';
        
        try {
            const res = await fetch(`${DB_URL}/all/messages.json`);
            const data = await res.json();
            if (data) {
                const items = Object.values(data).filter(m => m !== null);
                items.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                
                if (silent && items.length === lastMessageCount) {
                    return;
                }
                lastMessageCount = items.length;
                
                if (items.length > 0) {
                    container.innerHTML = items.map(m => `
                        <div class="message-item">
                            <span class="msg-user">${escapeHtml(m.username)}</span>
                            ${m.role ? `<span class="msg-role">${escapeHtml(m.role)}</span>` : ''}
                            <span class="msg-time">${m.timestamp ? new Date(m.timestamp).toLocaleString() : ''}</span>
                            <div class="msg-text">${escapeHtml(m.text)}</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="error-box">💬 Сообщений пока нет</div>';
                }
            } else {
                container.innerHTML = '<div class="error-box">❌ Сообщений нет</div>';
            }
        } catch(e) {
            if (!silent) container.innerHTML = `<div class="error-box">❌ Ошибка: ${e.message}</div>`;
        }
    };
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    
    // ===== ЗАПУСК =====
    if (document.getElementById('tab-messages').classList.contains('active')) {
        startAutoUpdate();
    }
</script>
</body>
</html>
