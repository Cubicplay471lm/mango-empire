<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Рыбалка с джойстиком</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a3a4a; }
    #ui {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(0,0,0,0.7); color: #fff; padding: 15px 25px;
      border-radius: 16px; border-left: 4px solid #f0c040;
      pointer-events: none; font-size: 18px; line-height: 1.6;
    }
    #ui span { color: #f0c040; }
    #joystick-zone {
      position: absolute; bottom: 40px; left: 40px; z-index: 10;
      width: 140px; height: 140px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 3px solid rgba(255,255,255,0.5);
      touch-action: none;
    }
    #joystick-knob {
      width: 60px; height: 60px; border-radius: 50%;
      background: radial-gradient(circle, #f0c040, #b08820);
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px rgba(240,192,64,0.6);
      pointer-events: none;
    }
    #cast-btn {
      position: absolute; bottom: 60px; right: 40px; z-index: 10;
      background: #f0c040; border: none; border-radius: 50px;
      padding: 18px 36px; font-size: 24px; font-weight: bold;
      color: #1a3a4a; box-shadow: 0 8px 0 #b08820;
      touch-action: manipulation; cursor: pointer;
      transition: 0.05s linear;
    }
    #cast-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #b08820; }
    #message {
      position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%);
      color: #aaffaa; font-size: 28px; background: rgba(0,0,0,0.6);
      padding: 10px 30px; border-radius: 40px; z-index: 10;
      text-shadow: 0 0 15px #00ff00; pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
    }
    #tension-bar {
      position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
      width: 260px; height: 20px; background: #333; border-radius: 20px;
      overflow: hidden; z-index: 10; border: 2px solid #888;
      opacity: 0; transition: opacity 0.3s;
    }
    #tension-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #ff4444, #ffaa00, #44ff44, #ffaa00, #ff4444);
      transition: width 0.05s linear;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>💰 Монет: <span id="coins">0</span></div>
    <div>🐟 Рыб: <span id="fishCount">0</span></div>
  </div>

  <div id="message">🎣 Забрось удочку!</div>
  <div id="tension-bar"><div id="tension-fill"></div></div>

  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <button id="cast-btn">🎣 Забросить</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ========== ОБЪЯВЛЕНИЯ ==========
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 8, 12);
    camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Свет
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 12, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Вода
    const waterGeom = new THREE.CircleGeometry(10, 32);
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x2a7a9a, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
    const water = new THREE.Mesh(waterGeom, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = -0.2;
    water.receiveShadow = true;
    scene.add(water);

    // Земля
    const groundGeom = new THREE.PlaneGeometry(30, 30);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a8a3a, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeom, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // Деревья
    function makeTree(x, z) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.5), new THREE.MeshStandardMaterial({ color: 0x8B5A2B }));
      trunk.position.y = 0.75; trunk.castShadow = true;
      g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.2, 6), new THREE.MeshStandardMaterial({ color: 0x2d8a2d }));
      leaves.position.y = 1.5; leaves.castShadow = true;
      g.add(leaves);
      g.position.set(x, -0.5, z);
      return g;
    }
    scene.add(makeTree(-6, -5));
    scene.add(makeTree(6, -5));
    scene.add(makeTree(-5, 7));
    scene.add(makeTree(5, 7));

    // Лодка (игрок)
    const boatGroup = new THREE.Group();
    const hull = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 2), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
    hull.position.y = 0.1;
    hull.castShadow = true;
    boatGroup.add(hull);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), new THREE.MeshStandardMaterial({ color: 0xCD853F }));
    cabin.position.set(0, 0.35, -0.3);
    cabin.castShadow = true;
    boatGroup.add(cabin);
    boatGroup.position.set(0, 0.0, 0);
    scene.add(boatGroup);

    // Рыба (префаб)
    const fishGroup = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), bodyMat);
    body.scale.set(1.2, 0.6, 0.4);
    body.castShadow = true;
    fishGroup.add(body);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.3), new THREE.MeshStandardMaterial({ color: 0xff4500 }));
    tail.rotation.x = Math.PI / 2;
    tail.position.set(-0.35, 0, 0);
    fishGroup.add(tail);
    fishGroup.visible = false;
    fishGroup.position.set(0, 0.2, 0);
    scene.add(fishGroup);

    // ========== ИГРОВАЯ ЛОГИКА ==========
    let coins = 0;
    let fishCaught = 0;
    let isFishing = false;
    let tension = 0;
    let tensionTarget = 50;
    let fishTimer = 0;
    let fishStrength = 1;
    let isBiting = false;
    let biteTimer = 0;

    // Управление джойстиком
    let joyX = 0, joyY = 0;
    const joystickZone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    const maxDist = 50;

    function handleJoystick(clientX, clientY) {
      const rect = joystickZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const max = rect.width / 2;
      if (dist > max) {
        dx = dx / dist * max;
        dy = dy / dist * max;
      }
      const normX = dx / max;
      const normY = dy / max; // -1..1
      joyX = Math.min(1, Math.max(-1, normX));
      joyY = Math.min(1, Math.max(-1, normY));
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    joystickZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleJoystick(touch.clientX, touch.clientY);
    });
    joystickZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleJoystick(touch.clientX, touch.clientY);
    });
    joystickZone.addEventListener('touchend', (e) => {
      e.preventDefault();
      joyX = 0; joyY = 0;
      knob.style.transform = 'translate(-50%, -50%)';
    });
    // Для мыши (ПК)
    let mouseDown = false;
    joystickZone.addEventListener('mousedown', (e) => {
      mouseDown = true;
      handleJoystick(e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', (e) => {
      if (!mouseDown) return;
      handleJoystick(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', () => {
      if (mouseDown) {
        mouseDown = false;
        joyX = 0; joyY = 0;
        knob.style.transform = 'translate(-50%, -50%)';
      }
    });

    // Кнопка заброса
    const castBtn = document.getElementById('cast-btn');
    const messageEl = document.getElementById('message');
    const tensionBar = document.getElementById('tension-bar');
    const tensionFill = document.getElementById('tension-fill');

    function showMessage(text, duration = 2000) {
      messageEl.textContent = text;
      messageEl.style.opacity = 1;
      clearTimeout(messageEl._timeout);
      messageEl._timeout = setTimeout(() => { messageEl.style.opacity = 0; }, duration);
    }

    function updateUI() {
      document.getElementById('coins').textContent = coins;
      document.getElementById('fishCount').textContent = fishCaught;
    }

    function startFishing() {
      if (isFishing) return;
      if (Math.random() < 0.3) {
        showMessage('🐟 Рыба не клюёт, попробуй в другом месте');
        return;
      }
      isFishing = true;
      isBiting = true;
      biteTimer = 0;
      tension = 30;
      tensionTarget = 30 + Math.random() * 40;
      fishStrength = 0.5 + Math.random() * 1.5;
      fishTimer = 0;
      // Показать рыбу
      fishGroup.visible = true;
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.5 + Math.random() * 1.5;
      fishGroup.position.x = Math.cos(angle) * radius;
      fishGroup.position.z = Math.sin(angle) * radius;
      fishGroup.position.y = -0.1;
      const hue = Math.random();
      body.material.color.setHSL(hue, 0.8, 0.5);
      tail.material.color.setHSL(hue, 0.8, 0.5);
      // Показать шкалу
      tensionBar.style.opacity = 1;
      tensionFill.style.width = '30%';
      showMessage('🐟 Клюёт! Держи натяжение джойстиком вверх/вниз', 3000);
      castBtn.textContent = '🎣 Вываживаю...';
      castBtn.disabled = true;
    }

    function finishFishing(success) {
      isFishing = false;
      fishGroup.visible = false;
      tensionBar.style.opacity = 0;
      castBtn.textContent = '🎣 Забросить';
      castBtn.disabled = false;
      if (success) {
        const reward = 10 + Math.floor(Math.random() * 20);
        coins += reward;
        fishCaught++;
        showMessage(`🎉 Поймал! +${reward} монет`, 2500);
        updateUI();
      } else {
        showMessage('❌ Рыба ушла', 1500);
      }
    }

    // Обновление натяжения через джойстик
    function updateTension(delta) {
      if (!isFishing) return;
      if (!isBiting) return;

      // Рыба дёргается
      tensionTarget += (Math.random() - 0.5) * 10 * fishStrength;
      tensionTarget = Math.max(20, Math.min(80, tensionTarget));

      // Влияние джойстика: движение вверх увеличивает натяжение, вниз уменьшает
      const joyInfluence = joyY; // -1..1
      tension += joyInfluence * delta * 30;
      // Влияние рыбы
      tension += (tensionTarget - tension) * delta * 0.5;

      tension = Math.max(0, Math.min(100, tension));
      tensionFill.style.width = tension + '%';

      // Проверка условий
      if (tension < 15) {
        showMessage('❌ Слишком слабо! Рыба ушла', 1500);
        finishFishing(false);
        return;
      }
      if (tension > 85) {
        showMessage('💥 Леска порвалась!', 1500);
        finishFishing(false);
        return;
      }

      // Успешное удержание в зоне 30–70
      if (tension >= 30 && tension <= 70) {
        fishTimer += delta;
        if (fishTimer >= 2.5) {
          // Поймал!
          finishFishing(true);
          return;
        }
      } else {
        fishTimer = Math.max(0, fishTimer - delta * 0.3);
      }
    }

    // ========== ОБНОВЛЕНИЕ ЛОДКИ ==========
    function updateBoat(delta) {
      const speed = 2.5;
      const rotSpeed = 2.0;
      // Движение вперёд/назад по направлению лодки
      const forward = new THREE.Vector3(0, 0, -1);
      forward.applyQuaternion(boatGroup.quaternion);
      const moveX = forward.x * joyY * speed * delta;
      const moveZ = forward.z * joyY * speed * delta;
      boatGroup.position.x += moveX;
      boatGroup.position.z += moveZ;

      // Поворот (влево/вправо)
      boatGroup.rotation.y -= joyX * rotSpeed * delta;

      // Ограничиваем движение в пределах озера
      const radius = 8;
      const dist = Math.sqrt(boatGroup.position.x*boatGroup.position.x + boatGroup.position.z*boatGroup.position.z);
      if (dist > radius) {
        boatGroup.position.x *= radius / dist;
        boatGroup.position.z *= radius / dist;
      }

      // Камера следует за лодкой
      const camOffset = new THREE.Vector3(0, 6, 8);
      camOffset.applyQuaternion(boatGroup.quaternion);
      camera.position.copy(boatGroup.position).add(camOffset);
      camera.lookAt(boatGroup.position.x, 0, boatGroup.position.z);
    }

    // ========== ЗАБРОС ==========
    castBtn.addEventListener('click', startFishing);

    // ========== АНИМАЦИЯ ==========
    let lastTime = 0;
    function animate(time) {
      const delta = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      updateBoat(delta);
      updateTension(delta);

      // Анимация рыбы
      if (fishGroup.visible) {
        fishGroup.position.y += Math.sin(time / 300) * 0.005;
        fishGroup.rotation.y = Math.sin(time / 400) * 0.2;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate(0);

    // ========== РЕСАЙЗ ==========
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ========== СТАРТ ==========
    updateUI();
    showMessage('🎣 Плыви на лодке и лови рыбу!', 3000);
  </script>
</body>
</html>
