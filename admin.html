<!DOCTYPE html>
<html>
<head>
    <title>Админ - База паспортов</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: system-ui, sans-serif; background: #1a1a2e; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; border-radius: 24px; padding: 24px; margin-bottom: 20px; }
        .admin-badge { background: #dc2626; color: white; padding: 5px 15px; border-radius: 20px; display: inline-block; font-size: 12px; margin-bottom: 15px; }
        h2 { margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #e0e0e0; border-radius: 12px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1f883d; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .delete-btn { background: #dc2626; margin-top: 5px; }
        .passport-item { background: #f9f9f9; padding: 15px; border-radius: 16px; margin-bottom: 12px; border-left: 4px solid #1f883d; }
        .passport-code { background: #e0e0e0; padding: 4px 8px; border-radius: 8px; font-family: monospace; font-size: 14px; display: inline-block; margin-top: 8px; }
        .stats { background: #e8f5e9; padding: 12px; border-radius: 16px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .error-msg { background: #fee; color: #c33; padding: 10px; border-radius: 12px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="admin-badge">👑 АДМИН ПАНЕЛЬ</div>
        <h2>➕ Создать паспорт</h2>
        <input type="text" id="fullName" placeholder="Полное имя">
        <input type="text" id="birthDate" placeholder="Дата рождения">
        <input type="text" id="passportCode" placeholder="Уникальный код (PASS123)">
        <button onclick="createPassport()">✨ Выдать паспорт</button>
    </div>

    <div class="card">
        <h2>📋 Все паспорта</h2>
        <div id="stats" class="stats">Загрузка...</div>
        <div id="passportsList"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://rnozszetsxmsndhytxot.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJub3pzemV0c3htc25kaHl0eG90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDEzNzcsImV4cCI6MjA5NjA3NzM3N30.njDuyU_XDj3QmNjqxsDUmIhiOd6IZVyUsucv-ttPsM8';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadAllPassports() {
        document.getElementById('stats').innerHTML = '📊 Загрузка...';
        document.getElementById('passportsList').innerHTML = '';
        
        const { data, error } = await supabase
            .from('passports')
            .select('*')
            .order('issued_date', { ascending: false });
        
        if (error) {
            document.getElementById('stats').innerHTML = '❌ Ошибка подключения к базе';
            document.getElementById('passportsList').innerHTML = `<div class="error-msg">Ошибка: ${error.message}<br><br>Проверьте: существует ли таблица "passports" в Supabase?</div>`;
            console.error('Supabase error:', error);
            return;
        }
        
        document.getElementById('stats').innerHTML = `📊 Всего паспортов: ${data.length}`;
        
        if (data.length === 0) {
            document.getElementById('passportsList').innerHTML = '<p style="text-align:center;">📭 Нет паспортов. Создайте первый!</p>';
            return;
        }
        
        document.getElementById('passportsList').innerHTML = data.map(p => `
            <div class="passport-item">
                <strong>👤 ${escapeHtml(p.full_name)}</strong><br>
                <div class="passport-code">🔑 ${escapeHtml(p.code)}</div>
                🎂 ${escapeHtml(p.birth_date || '—')}<br>
                📅 ${p.issued_date}<br>
                <button class="delete-btn" onclick="deletePassport('${escapeHtml(p.code)}')">❌ Удалить</button>
            </div>
        `).join('');
    }

    async function createPassport() {
        const fullName = document.getElementById('fullName').value.trim();
        const birthDate = document.getElementById('birthDate').value.trim();
        const code = document.getElementById('passportCode').value.trim();
        
        if (!fullName || !code) { 
            alert('❌ Заполните имя и код паспорта!'); 
            return;
        }
        
        const { error } = await supabase.from('passports').insert([{
            code: code,
            full_name: fullName,
            birth_date: birthDate || null,
            issued_date: new Date().toLocaleString()
        }]);
        
        if (error) { 
            alert('❌ Ошибка: ' + error.message); 
            console.error(error);
            return;
        }
        
        alert('✅ Паспорт создан!');
        document.getElementById('fullName').value = '';
        document.getElementById('birthDate').value = '';
        document.getElementById('passportCode').value = '';
        loadAllPassports();
    }

    async function deletePassport(code) {
        if (!confirm(`Удалить паспорт ${code}?`)) return;
        
        const { error } = await supabase.from('passports').delete().eq('code', code);
        if (error) { 
            alert('❌ Ошибка удаления: ' + error.message); 
            return;
        }
        
        alert('🗑️ Паспорт удалён');
        loadAllPassports();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Загружаем при открытии страницы
    loadAllPassports();
</script>
</body>
</html>
