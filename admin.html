<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель - Манго Империя</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #0a1f1a;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* Логин форма */
        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-card {
            background: white;
            border-radius: 32px;
            padding: 32px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }
        .login-card input {
            width: 100%;
            padding: 14px;
            margin: 16px 0;
            border: 2px solid #ddd;
            border-radius: 24px;
            font-size: 16px;
        }
        .login-card button {
            background: #1f4e3f;
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .error-msg { color: #c33; margin-top: 12px; font-size: 14px; }
        
        /* Основной админский интерфейс */
        .admin-content {
            display: none;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
        }
        h2 {
            margin-bottom: 20px;
            border-left: 5px solid #d9a13b;
            padding-left: 16px;
        }
        h3 { margin: 20px 0 12px 0; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-family: inherit;
        }
        button {
            background: #1f883d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin: 4px 4px 0 0;
        }
        button.danger { background: #dc2626; }
        button.secondary { background: #6b7280; }
        .passport-item, .announcement-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #1f883d;
        }
        .stats {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .json-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 11px;
            overflow-x: auto;
            max-height: 300px;
        }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>

<!-- Форма входа -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2>🔐 Админ панель</h2>
        <p style="margin-bottom: 16px; color: #555;">Введите пароль для доступа</p>
        <input type="password" id="adminPassword" placeholder="Пароль" autocomplete="off">
        <button onclick="checkPassword()">Войти</button>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<!-- Основной контент админки (скрыт до входа) -->
<div id="adminContent" class="admin-content">
    <div class="container">
        <div class="card">
            <h2>👑 АДМИН ПАНЕЛЬ</h2>
            <div class="stats" id="sessionInfo">Сессия активна</div>
            <button onclick="logout()" class="secondary">🚪 Выйти из админки</button>
        </div>

        <!-- Управление паспортами -->
        <div class="card">
            <h2>📋 Управление паспортами</h2>
            <div id="passportStats" class="stats">Загрузка...</div>
            <div id="passportsList"></div>
            
            <h3>➕ Создать новый паспорт</h3>
            <div class="flex">
                <input type="text" id="fullName" placeholder="Полное имя" style="flex:2">
                <input type="text" id="passportCode" placeholder="Код" style="flex:1">
            </div>
            <input type="text" id="birthDate" placeholder="Дата рождения">
            <button onclick="createPassport()">✨ Выдать паспорт</button>
        </div>

        <!-- Управление объявлениями -->
        <div class="card">
            <h2>📢 Управление объявлениями</h2>
            <div id="announcementsList"></div>
            
            <h3>➕ Создать объявление</h3>
            <input type="text" id="annTitle" placeholder="Заголовок">
            <textarea id="annText" rows="3" placeholder="Текст объявления"></textarea>
            <button onclick="createAnnouncement()">📢 Опубликовать</button>
        </div>

        <!-- Экспорт/импорт JSON -->
        <div class="card">
            <h2>💾 Экспорт / Импорт базы</h2>
            <div class="flex">
                <button onclick="downloadJSON()">📥 Скачать data.json</button>
                <input type="file" id="uploadFile" accept=".json" style="display:none;">
                <button onclick="document.getElementById('uploadFile').click()">📤 Загрузить data.json</button>
            </div>
            <hr>
            <h3>Текущие данные (скопируйте для резервной копии):</h3>
            <pre id="jsonPreview" class="json-box"></pre>
        </div>
    </div>
</div>

<script>
    // ПАРОЛЬ (можно изменить на свой)
    const ADMIN_PASSWORD = "рыбнадзор";
    
    let db = { passports: [], announcements: [] };
    let isAdminAuthenticated = false;

    // Проверка пароля
    function checkPassword() {
        const inputPass = document.getElementById('adminPassword').value;
        const errorDiv = document.getElementById('loginError');
        
        if (inputPass === ADMIN_PASSWORD) {
            isAdminAuthenticated = true;
            sessionStorage.setItem('admin_auth', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadFromStorage();
        } else {
            errorDiv.textContent = '❌ Неверный пароль';
        }
    }

    // Выход
    function logout() {
        sessionStorage.removeItem('admin_auth');
        isAdminAuthenticated = false;
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('adminPassword').value = '';
        document.getElementById('loginError').textContent = '';
    }

    // Проверка сессии при загрузке
    function checkSession() {
        const savedAuth = sessionStorage.getItem('admin_auth');
        if (savedAuth === 'true') {
            isAdminAuthenticated = true;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadFromStorage();
        }
    }

    // Загрузка данных из localStorage
    function loadFromStorage() {
        const saved = localStorage.getItem('country_admin_db');
        if (saved) {
            db = JSON.parse(saved);
        } else {
            db = {
                passports: [
                    { code: "1501", fullName: "Иван Петров", birthDate: "15.05.1990", issuedDate: new Date().toLocaleString() },
                    { code: "2302", fullName: "Мария Сидорова", birthDate: "23.11.1995", issuedDate: new Date().toLocaleString() }
                ],
                announcements: [
                    { id: 1, title: "Добро пожаловать!", text: "Сервер работает стабильно", date: new Date().toLocaleDateString(), active: true },
                    { id: 2, title: "Новый сезон", text: "Стартует через неделю", date: new Date().toLocaleDateString(), active: true }
                ]
            };
        }
        renderAll();
    }

    function saveToStorage() {
        localStorage.setItem('country_admin_db', JSON.stringify(db));
        renderAll();
        updateJSONPreview();
    }

    function renderAll() {
        renderPassports();
        renderAnnouncements();
    }

    function renderPassports() {
        const statsDiv = document.getElementById('passportStats');
        const listDiv = document.getElementById('passportsList');
        statsDiv.innerHTML = `📊 Всего паспортов: ${db.passports.length}`;
        if (db.passports.length === 0) {
            listDiv.innerHTML = '<p style="text-align:center;">📭 Нет паспортов</p>';
            return;
        }
        listDiv.innerHTML = db.passports.map((p, idx) => `
            <div class="passport-item">
                <strong>👤 ${escapeHtml(p.fullName)}</strong><br>
                🔑 ${escapeHtml(p.code)}<br>
                🎂 ${escapeHtml(p.birthDate || '—')}<br>
                📅 ${p.issuedDate}<br>
                <button class="danger" onclick="deletePassport(${idx})">❌ Удалить</button>
            </div>
        `).join('');
    }

    function renderAnnouncements() {
        const listDiv = document.getElementById('announcementsList');
        if (db.announcements.length === 0) {
            listDiv.innerHTML = '<p style="text-align:center;">📭 Нет объявлений</p>';
            return;
        }
        listDiv.innerHTML = db.announcements.map((a, idx) => `
            <div class="announcement-item">
                <strong>📌 ${escapeHtml(a.title)}</strong>
                <span style="float:right">
                    <button class="secondary" onclick="toggleAnnouncement(${idx})" style="font-size:12px;">${a.active ? '🔘 Скрыть' : '✅ Показать'}</button>
                    <button class="danger" onclick="deleteAnnouncement(${idx})" style="font-size:12px;">🗑️</button>
                </span>
                <p style="margin:8px 0;">${escapeHtml(a.text)}</p>
                <small>📅 ${a.date} | ${a.active ? '🟢 Активно' : '⚫ Скрыто'}</small>
            </div>
        `).join('');
    }

    function createPassport() {
        const fullName = document.getElementById('fullName').value.trim();
        const code = document.getElementById('passportCode').value.trim();
        const birthDate = document.getElementById('birthDate').value.trim();
        if (!fullName || !code) { alert('❌ Заполните имя и код'); return; }
        if (db.passports.find(p => p.code === code)) { alert('❌ Код уже существует'); return; }
        
        db.passports.push({
            fullName, code, birthDate,
            issuedDate: new Date().toLocaleString()
        });
        saveToStorage();
        document.getElementById('fullName').value = '';
        document.getElementById('passportCode').value = '';
        document.getElementById('birthDate').value = '';
        alert('✅ Паспорт создан');
    }

    function deletePassport(index) {
        if (!confirm('Удалить паспорт?')) return;
        db.passports.splice(index, 1);
        saveToStorage();
    }

    function createAnnouncement() {
        const title = document.getElementById('annTitle').value.trim();
        const text = document.getElementById('annText').value.trim();
        if (!title || !text) { alert('❌ Заполните заголовок и текст'); return; }
        db.announcements.push({
            id: Date.now(),
            title, text,
            date: new Date().toLocaleDateString(),
            active: true
        });
        saveToStorage();
        document.getElementById('annTitle').value = '';
        document.getElementById('annText').value = '';
        alert('✅ Объявление добавлено');
    }

    function toggleAnnouncement(index) {
        db.announcements[index].active = !db.announcements[index].active;
        saveToStorage();
    }

    function deleteAnnouncement(index) {
        if (!confirm('Удалить объявление?')) return;
        db.announcements.splice(index, 1);
        saveToStorage();
    }

    function downloadJSON() {
        const exportData = {
            passports: db.passports,
            announcements: db.announcements.map(a => ({ ...a }))
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'data.json';
        link.click();
        URL.revokeObjectURL(link.href);
        alert('✅ Файл скачан. Загрузите его на GitHub.');
    }

    function uploadJSON() {
        const file = document.getElementById('uploadFile').files[0];
        if (!file) { alert('Выберите файл'); return; }
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const newData = JSON.parse(e.target.result);
                if (newData.passports && newData.announcements) {
                    db = newData;
                    saveToStorage();
                    alert('✅ База обновлена!');
                } else alert('❌ Неверный формат');
            } catch(err) { alert('Ошибка парсинга'); }
        };
        reader.readAsText(file);
        document.getElementById('uploadFile').value = '';
    }

    function updateJSONPreview() {
        const preview = document.getElementById('jsonPreview');
        preview.textContent = JSON.stringify({ passports: db.passports, announcements: db.announcements }, null, 2);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    document.getElementById('uploadFile').addEventListener('change', uploadJSON);
    checkSession();
</script>
</body>
</html>
